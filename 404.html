    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="description" content="Buy the best men's running shoes. Lightweight, comfortable, and perfect for all terrains. Free shipping available!">
    <meta name="keywords" content="men's running shoes, lightweight running shoes, comfortable shoes">
    <meta name="author" content="YourStoreName">
    <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" /> -->

    <!-- 1. General Meta Tags -->
    <meta charset="UTF-8">
    <!-- Specifies character encoding -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Mobile responsiveness -->
    <meta name="author" content="ng-E-commerce">
    <!-- Author of the content -->
    <meta name="description" content="
    Discover ng-E-commerce, the ultimate e-commerce platform featuring a seamless shopping system.
    Easily browse, compare, and purchase top-quality [products/services]. Enjoy fast delivery,
    secure payment options, and 24/7 customer support. Upgrade your shopping experience today!">
    <meta name="keywords" content="keyword1, keyword2, keyword3">
    <!-- Keywords for SEO (less used nowadays) -->
    <meta name="generator" content="Tool or CMS used to create the page">
    <meta name="robots" content="index, follow">
    <!-- Search engine behavior -->

    <!-- 2. SEO-Specific Meta Tags -->
    <meta name="robots" content="noindex, nofollow">
    <!-- Prevent indexing and link-following -->
    <meta name="googlebot" content="index, follow">
    <!-- Behavior for Google's crawler -->
    <meta name="bingbot" content="index, follow">
    <!-- Behavior for Bing's crawler -->
    <meta name="geo.region" content="US-CA">
    <!-- Geographical region -->
    <meta name="geo.placename" content="San Francisco">
    <!-- Specific location -->
    <meta name="geo.position" content="37.7749;-122.4194">
    <!-- Latitude and longitude -->
    <meta name="ICBM" content="37.7749, -122.4194">
    <!-- Deprecated geo-tag equivalent -->

    <!-- 3. Social Media Meta Tags -->
    <meta property="og:title" content="Page Title">
    <meta property="og:description" content="Brief description of the page">
    <meta property="og:image" content="https://example.com/image.jpg">
    <meta property="og:url" content="https://example.com/page">
    <meta property="og:type" content="website">
    <!-- Options: article, website, product, etc. -->
    <meta property="og:site_name" content="YourSiteName">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Cards: -->
    <meta name="twitter:card" content="summary_large_image">
    <!-- Options: summary, app, player -->
    <meta name="twitter:site" content="@YourTwitterHandle">
    <meta name="twitter:title" content="Page Title">
    <meta name="twitter:description" content="Brief description of the page">
    <meta name="twitter:image" content="https://example.com/image.jpg">

    <!-- 4. Mobile-Specific Meta Tags   -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Enable full-screen mode for iOS -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Status bar style -->
    <meta name="format-detection" content="telephone=no">
    <!-- Disable auto-linking of phone numbers -->

    <!-- 5. Performance and Browser Configuration Meta Tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Compatibility with Internet Explorer -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <!-- Prevent caching -->
    <meta http-equiv="Expires" content="0">
    <!-- Expiration date for the document -->

    <!-- 6. E-Commerce and Product-Specific Meta Tags -->
    <meta itemprop="name" content="Product Name">
    <meta itemprop="description" content="Description of the product">
    <meta itemprop="image" content="https://example.com/product-image.jpg">
    <meta itemprop="price" content="19.99">
    <meta itemprop="priceCurrency" content="USD">
    <meta itemprop="availability" content="InStock">
    <!-- Options: InStock, OutOfStock -->

    <!-- 7. Security and Privacy Meta Tags -->
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com;"> -->
    <!-- <meta name="referrer" content="no-referrer"> Control referrer information -->
    <!-- <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains"> HTTPS enforcement -->

    <!-- 8. Miscellaneous Meta Tags -->
    <meta name="theme-color" content="#ffffff">
    <!-- Mobile browser toolbar color -->
    <meta name="color-scheme" content="light dark">
    <!-- Indicates theme support -->
    <meta name="application-name" content="YourApp">
    <!-- For web applications -->
    <meta name="rating" content="General">
    <!-- Page content rating -->
